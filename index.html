<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارت محصول مدرن</title>
  <style>
    /* استایل‌های اصلی */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* کارت اصلی */
    .card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 320px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
    }

    /* بخش تصویر */
    .card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4338ca;
      font-weight: bold;
    }

    /* محتوای کارت */
    .card-content {
      padding: 24px;
    }

    .card-tag {
      display: inline-block;
      background-color: #eeef5b;
      color: #854d0e;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #1f2937;
    }

    .card-description {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
    }

    /* بخش پایین کارت و دکمه */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-image">
      تصویر محصول
    </div>
    <div class="card-content">
      <span class="card-tag">جدید</span>
      <h3 class="card-title">هدفون بی‌سیم</h3>
      <p class="card-description">
        تجربه کیفیت صدای فوق‌العاده با تفکیک بالا و سیستم فعال حذف نویز محیط.
      </p>
      <div class="card-footer">
        <span class="price">۲,۵۰۰,۰۰۰ تومان</span>
        <button class="btn-primary">خرید</button>
      </div>
    </div>
  </div>

</body>
</html>
